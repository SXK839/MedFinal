<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients</title>
</head>
<body>

<h2>Patients</h2>

<table border="1">
    <tr>
        <th>First</th>
        <th>Last</th>
        <th>DOB</th>
        <th>Gender</th>
        <th>Action</th>
    </tr>

    <tr th:each="p : ${patients}">
        
        <td>
            <a th:href="@{/patients/{id}(id=${p.id})}">
                <span th:text="${p.firstName}"></span>
            </a>
        </td>

        <td th:text="${p.lastName}"></td>
        <td th:text="${p.dateOfBirth}"></td>
        <td th:text="${p.gender}"></td>

        <td>
            <a th:href="@{/patients/edit/{id}(id=${p.id})}">Edit</a> |
            
            <a th:href="@{/patients/delete/{id}(id=${p.id})}"
               onclick="return confirm('Are you sure?')">Delete</a>

        </td>

    </tr>
</table>

<br>

<a th:href="@{/patients/new}">Add New Patient</a>

</body>
</html>
