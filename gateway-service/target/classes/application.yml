server:
  port: 8080
  tomcat:
    threads:
      max: 50
      min-spare: 10

spring:
  main:
    lazy-initialization: true   # Green: reduces startup memory

  datasource:
    hikari:
      maximum-pool-size: 5      # Green: limits DB load
      minimum-idle: 2
      idle-timeout: 30000

  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        - id: patient
          uri: http://patient-service:8082
          predicates:
            - Path=/patients/**

        - id: notes
          uri: http://notes-service:8083
          predicates:
            - Path=/notes/**

        - id: risk
          uri: http://risk-assessment-service:8084
          predicates:
            - Path=/assess-risk/**

logging:
  level:
    root: WARN
